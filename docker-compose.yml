# ─────────────────────────────────────────────────────────────────────────────
#  Bus Tracker — Docker Compose
#
#  Quick start:
#    1. Copy .env.example → .env and set a strong SECRET_KEY
#    2. docker-compose up -d
#    3. Open http://localhost:5000 → follow the setup wizard
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Flask application ──────────────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set}"
      DATABASE_URL: "postgresql://${DB_USER:-bususer}:${DB_PASS:?DB_PASS must be set}@db:5432/${DB_NAME:-bustrack}"
      INSTALL_TOKEN: "${INSTALL_TOKEN:-}"
      BACKUP_ENCRYPTION_KEY: "${BACKUP_ENCRYPTION_KEY:-}"
      RESTORE_JOB_TTL_SECONDS: "${RESTORE_JOB_TTL_SECONDS:-1800}"
      RESTORE_SNAPSHOT_RETENTION_DAYS: "${RESTORE_SNAPSHOT_RETENTION_DAYS:-30}"
      SMTP_ALLOWED_HOSTS: "${SMTP_ALLOWED_HOSTS:-}"
      TRUSTED_PROXY_X_FOR: "${TRUSTED_PROXY_X_FOR:-0}"
      TRUSTED_PROXY_X_PROTO: "${TRUSTED_PROXY_X_PROTO:-0}"
      TRUSTED_PROXY_X_HOST: "${TRUSTED_PROXY_X_HOST:-0}"
      LOGIN_RATE_LIMIT_ATTEMPTS: "${LOGIN_RATE_LIMIT_ATTEMPTS:-5}"
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}"
      LOGIN_RATE_LIMIT_LOCK_SECONDS: "${LOGIN_RATE_LIMIT_LOCK_SECONDS:-300}"
      BROADCAST_JOB_TTL_SECONDS: "${BROADCAST_JOB_TTL_SECONDS:-86400}"
      IMPORT_MAX_ROWS: "${IMPORT_MAX_ROWS:-25000}"
      IMPORT_MAX_COLUMNS: "${IMPORT_MAX_COLUMNS:-64}"
      IMPORT_STAGE_TTL_HOURS: "${IMPORT_STAGE_TTL_HOURS:-24}"
      POWERSCHOOL_IMPORT_ENABLED: "${POWERSCHOOL_IMPORT_ENABLED:-0}"
      POWERSCHOOL_ROLLBACK_RETENTION_DAYS: "${POWERSCHOOL_ROLLBACK_RETENTION_DAYS:-30}"
      CSP_ENFORCE: "${CSP_ENFORCE:-1}"
      CSP_REPORT_ONLY: "${CSP_REPORT_ONLY:-0}"
    volumes:
      - ./instance:/app/instance          # wizard lock + private import staging
      - ./static/uploads:/app/static/uploads  # logos / icons
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       "${DB_NAME:-bustrack}"
      POSTGRES_USER:     "${DB_USER:-bususer}"
      POSTGRES_PASSWORD: "${DB_PASS:?DB_PASS must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bususer} -d ${DB_NAME:-bustrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# ─────────────────────────────────────────────────────────────────────────────
#  SQLite-only alternative (no database service needed):
#  Comment out the 'db' service and volumes, and change DATABASE_URL to:
#    DATABASE_URL: "sqlite:////app/instance/bustrack.db"
# ─────────────────────────────────────────────────────────────────────────────
